name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The tests use stand-in YOLO models, so the heavy packages
      # (PyTorch, ultralytics, easyocr, streamlit) are NOT needed here.
      - name: Install test dependencies
        run: pip install numpy pandas opencv-python-headless pytest ruff

      - name: Lint
        run: ruff check src tests scripts

      - name: Lint (dependency-free fallback check)
        run: python scripts/lint_check.py src/*.py tests/*.py scripts/*.py

      - name: Test
        run: pytest